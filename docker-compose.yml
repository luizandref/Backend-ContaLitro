services:
  postgres:
    image: postgres:18
    container_name: contalitro-postgres
    environment:
      POSTGRES_DB: contalitro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - contalitro-data:/var/lib/postgresql

volumes:
  contalitro-data: